name: Refresh place data

# Holt die Ortsdaten monatlich neu aus OpenStreetMap und öffnet bei Änderungen einen Pull Request.
on:
  schedule:
    - cron: '0 4 1 * *'   # am 1. jedes Monats, 04:00 UTC
  workflow_dispatch:
    inputs:
      category:
        description: 'Nur diese Kategorie aktualisieren (leer = alle)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch places from Overpass
        env:
          CATEGORY: ${{ inputs.category }}
        run: |
          if [ -n "$CATEGORY" ]; then
            dotnet run --project tools/FetchPlaces -- --category "$CATEGORY"
          else
            dotnet run --project tools/FetchPlaces
          fi

      - name: Validate data
        run: dotnet test tests/Placebook.Tests --filter "FullyQualifiedName~DataFileTests"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/refresh
          commit-message: Refresh place data from OpenStreetMap
          title: Ortsdaten aktualisieren
          body: |
            Automatisch aus OpenStreetMap (Overpass API) neu erzeugt.
            © OpenStreetMap contributors, ODbL.
          add-paths: src/Placebook/wwwroot/data/**
          delete-branch: true
