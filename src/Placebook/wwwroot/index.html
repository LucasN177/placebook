<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placebook</title>
    <!-- Wird beim Deploy auf GitHub Pages durch den Repo-Pfad (z. B. /placebook/) ersetzt -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <meta name="theme-color" content="#1E3A5F" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
    <link rel="stylesheet" href="lib/leaflet.markercluster/MarkerCluster.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <script src="js/version.js"></script>

    <!-- GitHub Pages SPA-Fallback: 404.html leitet Deep Links als "?/pfad" hierher um.
         Dieses Skript stellt die ursprüngliche URL wieder her, bevor der Blazor-Router startet. -->
    <script>
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>
</head>

<body>
    <div id="app">
        <!-- Ladebildschirm, bis Blazor gestartet ist. Der Ring zeigt den echten Ladefortschritt
             (--blazor-load-percentage wird von Blazor gesetzt). -->
        <div class="pb-splash" role="status" aria-live="polite">
            <svg class="pb-splash-ring" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="pb-splash-track" cx="60" cy="60" r="54" />
                <circle class="pb-splash-progress" cx="60" cy="60" r="54" />
                <path class="pb-splash-pin" fill-rule="evenodd"
                      d="M60 90 L44 66 A20 20 0 1 1 76 66 Z M52 54 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 Z" />
            </svg>
            <div class="pb-splash-title">Placebook</div>
            <div class="pb-splash-subtitle">Sammle Orte in ganz Europa</div>
            <div class="pb-splash-percent"></div>
            <div class="pb-splash-footer">Version <span class="pb-splash-version"></span> · by Lucas Nagelsmann</div>
        </div>
        <script>
            document.querySelector('.pb-splash-version').textContent = window.placebookVersion();
        </script>
    </div>

    <div id="blazor-error-ui">
        Es ist ein unerwarteter Fehler aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="lib/leaflet/leaflet.js"></script>
    <script src="lib/leaflet.markercluster/leaflet.markercluster.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
</body>

</html>
