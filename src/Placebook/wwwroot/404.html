<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <title>Placebook</title>
    <!-- GitHub Pages kennt keine Rewrites. Deep Links wie /placebook/settings landen hier und werden
         als /placebook/?/settings auf index.html umgeleitet (Muster: github.com/rafgraph/spa-github-pages).
         pathSegmentsToKeep = 1, weil die App unter /<repo-name>/ liegt. Bei eigener Domain auf 0 setzen. -->
    <script>
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
